name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild (leave empty for the pushed tag)"
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-version:
    name: Verify tag matches package.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Check version
        run: |
          PKG_VERSION=$(bun -e "console.log(require('./package.json').version)")
          TAG="${{ inputs.tag || github.ref_name }}"
          TAG="${TAG#v}"
          echo "package.json: $PKG_VERSION"
          echo "tag:          $TAG"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "Version mismatch" >&2
            exit 1
          fi

  build-windows:
    name: Build Windows
    needs: verify-version
    uses: ./.github/workflows/build.yml
    with:
      os: windows-latest
      builder_args: --win nsis portable

  build-linux:
    name: Build Linux
    needs: verify-version
    uses: ./.github/workflows/build.yml
    with:
      os: ubuntu-latest
      builder_args: --linux AppImage deb rpm

  build-macos:
    name: Build macOS
    needs: verify-version
    uses: ./.github/workflows/build.yml
    with:
      os: macos-latest
      builder_args: --mac dmg zip

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: release-*
          merge-multiple: true
      - name: Validate artifact set
        run: |
          set -e
          ls -la release-artifacts
          test -n "$(ls release-artifacts/*-setup-*.exe 2>/dev/null)" || { echo "missing setup exe"; exit 1; }
          test -n "$(ls release-artifacts/*-portable-*.exe 2>/dev/null)" || { echo "missing portable exe"; exit 1; }
          test -f release-artifacts/latest.yml || { echo "missing latest.yml"; exit 1; }
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: false
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: release-artifacts/*
